name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Secrets scan — runs unconditionally, no dependency install needed.
  # Uses the gitleaks CLI directly (free/OSS) instead of gitleaks-action,
  # which requires a paid license for organization-owned repos.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan for committed secrets
        run: gitleaks detect --source . --redact -v

  dependency-check:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.dependencies.outputs.root }}
      backend: ${{ steps.dependencies.outputs.backend }}
      frontend: ${{ steps.dependencies.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: dependencies
        run: |
          echo "root=$([ -f package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "backend=$([ -f src/backend/package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f src/frontend/package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    needs: dependency-check
    if: needs.dependency-check.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Coverage floor — Phase 4 checkpoint requirement, keeps streak/grace-day
      # logic from regressing untested.
      - name: Run tests with coverage
        run: npm test -- --coverage --coverageThreshold='{"global":{"branches":85,"functions":85,"lines":85,"statements":85}}'

      # Security / lint quality gate — Phase 4 checkpoint requirement.
      # Swap for pip-audit / bandit / etc. if the backend is Python.
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

  backend:
    needs: dependency-check
    if: needs.dependency-check.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageThreshold='{"global":{"branches":85,"functions":85,"lines":85,"statements":85}}'

  frontend:
    needs: dependency-check
    if: needs.dependency-check.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageThreshold='{"global":{"branches":85,"functions":85,"lines":85,"statements":85}}'

      - name: Build
        run: npm run build

  e2e:
    needs: [dependency-check, backend, frontend]
    if: >-
      always() &&
      needs.dependency-check.outputs.root == 'true' &&
      needs.dependency-check.outputs.backend == 'true' &&
      needs.dependency-check.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run e2e tests
        run: npx playwright test

  # Spec-code sync check — the CI embodiment of "spec is the source of
  # truth." Fails the PR if implementation code changed without a matching
  # spec update, so the openspec/ archive stays an honest record of what
  # was actually built rather than drifting from reality.
  spec-code-sync:
    needs: dependency-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check src/ changes have a matching spec update
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git hash-object -t tree /dev/null)
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          SRC_CHANGED=$(echo "$CHANGED" | grep -E '^src/' || true)
          SPEC_CHANGED=$(echo "$CHANGED" | grep -E '^(specs/|openspec/changes/)' || true)

          if [ -n "$SRC_CHANGED" ] && [ -z "$SPEC_CHANGED" ]; then
            echo "::error::src/ changed but no matching update under specs/ or openspec/changes/."
            echo "If this PR implements a spec'd feature, update the delta spec or specs/features/*/spec.md."
            echo "If this is a genuine exception (typo fix, refactor with no behavior change), add"
            echo "'skip-spec-check' as a PR label to bypass this gate."
            echo "$SRC_CHANGED"
            exit 1
          fi

  # Optional: add a secrets scanner (e.g., gitleaks) as a second gate once
  # the repo has real integrations (GitHub MCP tokens, email provider keys).
